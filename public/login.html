<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교사 로그인 · 우리 반 플레이데이</title><link rel="stylesheet" href="/app.css"></head><body><header><span class="brand"><span class="logo">▶</span>우리 반 플레이데이</span></header><main><section class="card login"><h1>교사 로그인</h1><p>경기를 진행하고 팀 점수를 관리해요.<br>학생은 선생님이 공유한 학생 링크로 접속해 주세요.</p><form id="login"><label for="email">교사 이메일</label><input type="email" id="email" autocomplete="username" required maxlength="254"><label for="password">교사 비밀번호</label><input type="password" id="password" autocomplete="current-password" required maxlength="512"><button type="submit">로그인</button><p id="error" class="error" role="alert"></p></form></section></main><script src="/login.js"></script></body></html>
